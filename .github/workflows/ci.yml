name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bazel test
        run: bazel test //...
      # The script suite is deliberately outside bazel (the release tool and its tests are
      # .main.kts files); the runner self-locates, so this tests the checked-out tree.
      - name: script tests
        run: scripts/run-script-tests.sh

  # Build and test this module the way a consumer does: as an external repo under a root module of
  # its own. The job above cannot see this class of defect: a label that resolves only when this
  # module is the main repo, a runfiles path that assumes it is, or a JDK API newer than the
  # consumer's JDK. A consumer does not inherit this repo's .bazelrc, so every JDK choice below is
  # explicit. A fresh checkout holds no bazel-* convenience links, so this job does not check that
  # REPO.bazel keeps a consumer's @agency//... from loading them as packages.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: consumer module
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cp .bazelversion "$RUNNER_TEMP/consumer/"
          printf 'bazel_dep(name = "agency")\nlocal_path_override(module_name = "agency", path = "%s")\n' \
            "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/consumer/MODULE.bazel"
      - name: bazel test @agency//... (JDK 21)
        working-directory: ${{ runner.temp }}/consumer
        run: >-
          bazel test --keep_going --test_output=errors
          --java_runtime_version=21 --tool_java_runtime_version=21 @agency//...
      # The sources stay on JDK 11 APIs: Bazel's default tool runtime is remotejdk_11, and kotlinc
      # compiles against the class library of the JDK it runs on, so a consumer that sets nothing
      # compiles them on JDK 11. This build runs the tools on JDK 11 as that consumer does, so it
      # also fails if a build tool stops running there; a kotlinc flag could at most check the APIs.
      # Build only: the Kotlin toolchain emits JVM 17 bytecode, which a JDK 11 runtime cannot load.
      - name: bazel build @agency//... (JDK 11)
        working-directory: ${{ runner.temp }}/consumer
        run: >-
          bazel build --keep_going
          --java_runtime_version=remotejdk_11 --tool_java_runtime_version=remotejdk_11 @agency//...

  # Enforce the CONTRIBUTING sign-off (Developer Certificate of Origin). PRs only — the
  # per-PR commit range is a pull_request concept, and the post-merge push to main carries
  # only the squashed result.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO sign-off check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff from the CURRENT tip of the base branch, not the event payload's base.sha.
          # That sha is frozen when the event fires, so once main advances and the branch is
          # rebased onto it, a base.sha range sweeps in main's own commits — GitHub's unsigned
          # squash merges — and false-fails. Fetch the base ref so origin/<base> is current;
          # the range is then only the PR's own commits.
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          shas="$(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")"
          fail=0
          for sha in $shas; do
            if ! git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit ${sha} has no Signed-off-by line (see CONTRIBUTING.md; add with 'git commit -s')."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Every commit must carry 'Signed-off-by: Name <email>' (CONTRIBUTING.md). Add with: git commit -s"
            exit 1
          fi
          echo "DCO: all commits signed off."
